<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  body {
    width: 380px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 14px;
    background: #fafafa;
    color: #1a1a1a;
  }
  h1 {
    font-size: 14px;
    margin: 0 0 10px;
    font-weight: 600;
  }
  .status {
    font-size: 12px;
    color: #666;
    margin-bottom: 8px;
  }
  .status.ok { color: #1a7f37; }
  .status.err { color: #c0392b; }
  textarea {
    width: 100%;
    height: 110px;
    box-sizing: border-box;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 11px;
    padding: 8px;
    border: 1px solid #ddd;
    border-radius: 6px;
    resize: vertical;
    background: #fff;
  }
  .row {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }
  button {
    flex: 1;
    padding: 8px 10px;
    border: none;
    border-radius: 6px;
    background: #2563eb;
    color: white;
    font-size: 12px;
    cursor: pointer;
  }
  button.secondary {
    background: #e5e7eb;
    color: #1a1a1a;
  }
  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .source {
    font-size: 11px;
    color: #888;
    margin-top: 6px;
  }
  .toast {
    font-size: 11px;
    color: #1a7f37;
    margin-top: 6px;
    height: 14px;
  }
</style>
</head>
<body>
  <h1>Hilokal JWT Grabber</h1>
  <div id="status" class="status">Checking...</div>
  <textarea id="token" placeholder="No token found yet." readonly></textarea>
  <div id="source" class="source"></div>
  <div class="row">
    <button id="copyBtn" disabled>Copy</button>
    <button id="refreshBtn" class="secondary">Refresh</button>
  </div>
  <div id="toast" class="toast"></div>
  <script src="popup.js"></script>
</body>
</html>
